<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Celestial Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F1E8;
      --card-border: #E2DDD3;
      --text-main: #111111;
      --text-sub: #76736E;
      --accent-orange: #E25B36;
      --accent-blue: #3A7CA5;
      --accent-yellow: #F0B35B;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 30px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -1px;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 30px;
      align-items: start;
    }

    /* Main Orbital Canvas */
    .canvas-card {
      border: 1px solid var(--card-border);
      background-color: #FAF8F5;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    canvas#orbitCanvas {
      background-color: #FAF8F5;
      display: block;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
    }

    button {
      background-color: var(--bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #EFEBE4;
      border-color: var(--text-sub);
    }

    button.active {
      background-color: var(--accent-orange);
      color: #FFFFFF;
      border-color: var(--accent-orange);
    }

    select {
      background-color: var(--bg);
      border: 1px solid var(--card-border);
      padding: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      border-radius: 4px;
    }

    /* Right Side Panel matching Sketch */
    .side-panel {
      border: 1px solid var(--card-border);
      background-color: #FAF8F5;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .time-display {
      font-family: 'JetBrains Mono', monospace;
    }

    .date-str {
      font-size: 18px;
      font-weight: 700;
    }

    .time-str {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .moon-box {
      border: 1px solid var(--card-border);
      padding: 16px;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .moon-info {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .moon-info div {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Celestial Clock</h1>
  </div>

  <div class="app-container">
    
    <!-- LEFT: Top-Down Orbit View -->
    <div class="canvas-card">
      <canvas id="orbitCanvas" width="650" height="550"></canvas>

      <!-- Simulation Controls -->
      <div class="controls-bar">
        <button id="btn-reverse">◄ Reverse</button>
        <button id="btn-pause" class="active">⏸ Pause</button>
        <button id="btn-play">► Play Real-time</button>
        <button id="btn-ff">►► Fast Forward</button>
        
        <select id="speed-select">
          <option value="1">1x Speed</option>
          <option value="86400">1 Day / sec</option>
          <option value="604800">1 Week / sec</option>
          <option value="2592000">1 Month / sec</option>
        </select>

        <button id="btn-reset">Reset Live</button>
      </div>
    </div>

    <!-- RIGHT: Info Panel matching drawing layout -->
    <div class="side-panel">
      <div>
        <div class="panel-label">Current Date & Time</div>
        <div class="time-display" style="margin-top: 8px;">
          <div class="date-str" id="date-display">--</div>
          <div class="time-str" id="time-display">-- AKDT</div>
        </div>
      </div>

      <!-- Moon Phase Graphic Box -->
      <div class="moon-box">
        <canvas id="moonCanvas" width="100" height="100"></canvas>
        <div class="moon-info">
          <div><strong>Moon phase:</strong> <span id="moon-phase-name">--</span></div>
          <div><strong>Illumination:</strong> <span id="moon-illum-val">--%</span></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- SIMULATION STATE ---
    let simDate = new Date();
    let isLive = true;
    let playDirection = 0; // -1: Reverse, 0: Paused, 1: Forward
    let timeScale = 1; // Seconds simulated per real-time second
    let lastAnimTime = performance.now();

    // Astronomical constants
    const AK_OFFSET_HOURS = -8; // AKDT UTC offset

    // --- ASTRONOMICAL CALCULATIONS ---
    function getJulianDate(date) {
      return (date.getTime() / 86400000) + 2440587.5;
    }

    function getEarthOrbitAngle(date) {
      // Vernal Equinox (around March 20) as 0 degrees
      const startOfYear = new Date(date.getFullYear(), 0, 1);
      const dayOfYear = (date - startOfYear) / (1000 * 60 * 60 * 24);
      // March 20 is ~day 79
      const daysSinceEquinox = dayOfYear - 79;
      const angle = (daysSinceEquinox / 365.2422) * 2 * Math.PI;
      return angle;
    }

    function getLunarPhaseData(date) {
      const refDate = new Date(2024, 0, 11); // Known New Moon
      const daysSinceRef = (date - refDate) / (1000 * 60 * 60 * 24);
      const lunarCycle = 29.53058770576;
      const phaseValue = ((daysSinceRef % lunarCycle) + lunarCycle) % lunarCycle / lunarCycle;

      const illumination = Math.round((1 - Math.cos(phaseValue * 2 * Math.PI)) / 2 * 100);

      let phaseName = "";
      if (phaseValue < 0.03 || phaseValue >= 0.97) phaseName = "New Moon";
      else if (phaseValue < 0.22) phaseName = "Waxing Crescent";
      else if (phaseValue < 0.28) phaseName = "First Quarter";
      else if (phaseValue < 0.47) phaseName = "Waxing Gibbous";
      else if (phaseValue < 0.53) phaseName = "Full Moon";
      else if (phaseValue < 0.72) phaseName = "Waning Gibbous";
      else if (phaseValue < 0.78) phaseName = "Last Quarter";
      else phaseName = "Waning Crescent";

      return { phaseValue, phaseName, illumination };
    }

    // --- CANVAS RENDERING ---
    function drawOrbitSystem() {
      const canvas = document.getElementById('orbitCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      // 1. Draw Season Labels matching sketch
      ctx.font = '13px "JetBrains Mono", monospace';
      ctx.fillStyle = '#76736E';
      ctx.textAlign = 'center';

      ctx.fillText('Winter Solstice', cx, cy - 200);
      ctx.fillText('Summer Solstice', cx, cy + 215);
      ctx.textAlign = 'right';
      ctx.fillText('Spring Equinox', cx - 210, cy + 4);
      ctx.textAlign = 'left';
      ctx.fillText('Fall Equinox', cx + 210, cy + 4);

      // 2. Earth Orbit Path
      const orbitRadius = 180;
      ctx.beginPath();
      ctx.arc(cx, cy, orbitRadius, 0, 2 * Math.PI);
      ctx.strokeStyle = '#E2DDD3';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. Central Sun
      ctx.beginPath();
      ctx.arc(cx, cy, 32, 0, 2 * Math.PI);
      ctx.fillStyle = '#F0B35B';
      ctx.fill();
      ctx.strokeStyle = '#E25B36';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 4. Calculate Earth Position
      const earthAngle = getEarthOrbitAngle(simDate);
      // Coordinate mapping: Spring = Left (-X), Fall = Right (+X), Winter = Top (-Y), Summer = Bottom (+Y)
      const earthX = cx - orbitRadius * Math.cos(earthAngle);
      const earthY = cy + orbitRadius * Math.sin(earthAngle);

      // Moon Orbit Path around Earth
      const moonOrbitRadius = 36;
      ctx.beginPath();
      ctx.arc(earthX, earthY, moonOrbitRadius, 0, 2 * Math.PI);
      ctx.strokeStyle = '#D8D3C8';
      ctx.lineWidth = 1;
      ctx.stroke();

      // 5. Calculate Moon Position relative to Earth
      const lunarData = getLunarPhaseData(simDate);
      // Phase 0 = New Moon (Moon between Earth and Sun)
      const moonAngle = earthAngle + (lunarData.phaseValue * 2 * Math.PI);
      const moonX = earthX + moonOrbitRadius * Math.cos(moonAngle);
      const moonY = earthY - moonOrbitRadius * Math.sin(moonAngle);

      // 6. Draw Earth
      ctx.beginPath();
      ctx.arc(earthX, earthY, 14, 0, 2 * Math.PI);
      ctx.fillStyle = '#3A7CA5';
      ctx.fill();
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Simple continent details on Earth
      ctx.beginPath();
      ctx.arc(earthX - 3, earthY - 2, 4, 0, 2 * Math.PI);
      ctx.fillStyle = '#83B692';
      ctx.fill();

      // 7. Draw Moon Body (Half Lit facing Sun at center)
      ctx.beginPath();
      ctx.arc(moonX, moonY, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#1C1C1E'; // Dark base
      ctx.fill();

      // Draw lit hemisphere toward central Sun
      const angleToSun = Math.atan2(cy - moonY, cx - moonX);
      ctx.beginPath();
      ctx.arc(moonX, moonY, 6, angleToSun - Math.PI / 2, angleToSun + Math.PI / 2, false);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(moonX, moonY, 6, 0, 2 * Math.PI);
      ctx.strokeStyle = '#76736E';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // --- DRAW MOON PHASE CANVAS (RIGHT PANEL) ---
    function drawMoonPhasePanel(lunarData) {
      const canvas = document.getElementById('moonCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const cx = size / 2;
      const cy = size / 2;
      const r = size / 2 - 6;

      const illum = lunarData.illumination / 100;
      const phase = lunarData.phaseName.toLowerCase();
      const isWaning = phase.includes('waning') || phase.includes('last');
      const isFull = phase.includes('full');
      const isNew = phase.includes('new');

      ctx.clearRect(0, 0, size, size);

      // Dark background disk
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.fillStyle = '#1C1C1E';
      ctx.fill();

      if (isFull || illum >= 0.99) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
      } else if (!isNew && illum > 0.01) {
        const curveWidth = Math.abs(r * (2 * illum - 1));
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();

        if (isWaning) {
          ctx.arc(cx, cy, r, Math.PI / 2, (3 * Math.PI) / 2, false);
          ctx.ellipse(cx, cy, curveWidth, r, 0, (3 * Math.PI) / 2, Math.PI / 2, illum >= 0.5);
        } else {
          ctx.arc(cx, cy, r, (3 * Math.PI) / 2, Math.PI / 2, false);
          ctx.ellipse(cx, cy, curveWidth, r, 0, Math.PI / 2, (3 * Math.PI) / 2, illum < 0.5);
        }
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.strokeStyle = '#E2DDD3';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // --- UI UPDATER ---
    function updateUI() {
      const dateOptions = { month: 'long', day: 'numeric', year: 'numeric' };
      const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };

      document.getElementById('date-display').innerText = simDate.toLocaleDateString('en-US', dateOptions);
      document.getElementById('time-display').innerText = simDate.toLocaleTimeString('en-US', timeOptions);

      const lunarData = getLunarPhaseData(simDate);
      document.getElementById('moon-phase-name').innerText = lunarData.phaseName;
      document.getElementById('moon-illum-val').innerText = `${lunarData.illumination}%`;

      drawMoonPhasePanel(lunarData);
      drawOrbitSystem();
    }

    // --- ANIMATION LOOP ---
    function animate(now) {
      const deltaSec = (now - lastAnimTime) / 1000;
      lastAnimTime = now;

      if (isLive) {
        simDate = new Date();
      } else if (playDirection !== 0) {
        const addMs = playDirection * timeScale * deltaSec * 1000;
        simDate = new Date(simDate.getTime() + addMs);
      }

      updateUI();
      requestAnimationFrame(animate);
    }

    // --- CONTROLS HANDLERS ---
    function setControlState(dir, live = false) {
      isLive = live;
      playDirection = dir;

      document.getElementById('btn-reverse').classList.toggle('active', dir === -1);
      document.getElementById('btn-pause').classList.toggle('active', dir === 0 && !live);
      document.getElementById('btn-play').classList.toggle('active', dir === 1 || live);
      document.getElementById('btn-ff').classList.toggle('active', dir === 2);
    }

    document.getElementById('btn-reverse').onclick = () => {
      timeScale = parseFloat(document.getElementById('speed-select').value);
      setControlState(-1);
    };

    document.getElementById('btn-pause').onclick = () => {
      setControlState(0);
    };

    document.getElementById('btn-play').onclick = () => {
      timeScale = 1;
      setControlState(1, true);
    };

    document.getElementById('btn-ff').onclick = () => {
      timeScale = parseFloat(document.getElementById('speed-select').value);
      if (timeScale === 1) timeScale = 86400; // Default FF speed
      setControlState(1);
      document.getElementById('btn-ff').classList.add('active');
    };

    document.getElementById('speed-select').onchange = (e) => {
      timeScale = parseFloat(e.target.value);
    };

    document.getElementById('btn-reset').onclick = () => {
      simDate = new Date();
      timeScale = 1;
      setControlState(1, true);
    };

    // --- INITIALIZATION ---
    requestAnimationFrame((now) => {
      lastAnimTime = now;
      animate(now);
    });
  </script>
</body>
</html>
