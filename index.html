<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Clock</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050508; color: #fff; font-family: monospace; overflow: hidden; }
        #canvas-container { position: relative; width: 100vw; height: 100vh; }
        
        /* Speed Controls (Bottom Left) */
        #controls {
            position: absolute; bottom: 20px; left: 20px;
            background: rgba(10, 10, 15, 0.85); padding: 12px 18px; border-radius: 8px;
            display: flex; gap: 10px; align-items: center; border: 1px solid #333; z-index: 10;
        }
        button { background-color: #28283c; color: #fff; border: 1px solid #4a4a6a; padding: 8px 14px; cursor: pointer; border-radius: 4px; font-family: monospace; }
        button:hover { background-color: #3d3d5c; }

        /* Telemetry & Moon Phase Panel (Top Right) */
        #telemetry-panel {
            position: absolute; top: 20px; right: 20px;
            background: rgba(10, 10, 15, 0.85); padding: 16px; border-radius: 8px;
            border: 1px solid #333; z-index: 10; width: 200px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .info-title { color: #aaa; font-size: 11px; text-transform: uppercase; margin-top: 8px; }
        .info-value { font-size: 14px; font-weight: bold; margin-bottom: 4px; color: #ffd700; }
        #moonCanvas { margin: 10px 0; background: #000; border-radius: 50%; border: 1px solid #444; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="controls">
        <button onclick="setRealtime()">Real-time</button>
        <button onclick="adjustSpeed(100)">100x</button>
        <button onclick="adjustSpeed(10000)">10,000x</button>
        <button onclick="adjustSpeed(100000)">100,000x</button>
        <span id="speedDisplay">Speed: 1x</span>
    </div>

    <div id="telemetry-panel">
        <div class="info-title">Date & Time</div>
        <div id="dateDisplay" class="info-value">----</div>

        <div class="info-title">Moon View from Earth</div>
        <canvas id="moonCanvas" width="100" height="100"></canvas>

        <div id="phaseName" class="info-value" style="color: #fff;">----</div>
        <div id="illuminationDisplay" style="font-size: 12px; color: #aaa;">Illumination: --%</div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('canvas-container').appendChild(renderer.domElement);

camera.position.set(0, 450, 350);
camera.lookAt(0, 0, 0);

let simTime = new Date();
let timeMultiplier = 1;
const speedDisplay = document.getElementById('speedDisplay');

function adjustSpeed(factor) { timeMultiplier = factor; updateSpeedDisplay(); }
function setRealtime() { timeMultiplier = 1; simTime = new Date(); updateSpeedDisplay(); }
function updateSpeedDisplay() { speedDisplay.textContent = `Speed: ${timeMultiplier.toLocaleString()}x`; }

const AXIAL_TILT_RAD = 23.4 * (Math.PI / 180);
const EARTH_ORBIT_RADIUS = 340;
const MOON_ORBIT_RADIUS = 90;

const SUN_RADIUS = 45;
const EARTH_RADIUS = 32; 
const MOON_RADIUS = 12; 

// 1. Sun & Enhanced Lighting
const sunGeometry = new THREE.SphereGeometry(SUN_RADIUS, 32, 32);
const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffd700 });
const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

const sunLight = new THREE.PointLight(0xffffff, 4.0, 2000);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const ambientLight = new THREE.AmbientLight(0x777788); 
scene.add(ambientLight);

// 2. Textures
const textureLoader = new THREE.TextureLoader();

const earthMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
textureLoader.load(
    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    (texture) => { earthMaterial.map = texture; earthMaterial.needsUpdate = true; }
);

const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
const earth = new THREE.Mesh(earthGeometry, earthMaterial);
earth.rotation.z = AXIAL_TILT_RAD; 
scene.add(earth);

const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8 });
textureLoader.load(
    'https://threejs.org/examples/textures/planets/moon_1024.jpg',
    (texture) => { moonMaterial.map = texture; moonMaterial.needsUpdate = true; }
);

const moonGeometry = new THREE.SphereGeometry(MOON_RADIUS, 32, 32);
const moon = new THREE.Mesh(moonGeometry, moonMaterial);

function createOrbitLine(radius) {
    const geometry = new THREE.RingGeometry(radius - 0.75, radius + 0.75, 64);
    const material = new THREE.MeshBasicMaterial({ color: 0x444455, side: THREE.DoubleSide });
    const line = new THREE.Mesh(geometry, material);
    line.rotation.x = Math.PI / 2;
    return line;
}
scene.add(createOrbitLine(EARTH_ORBIT_RADIUS));

const moonSystemGroup = new THREE.Group();
moonSystemGroup.add(createOrbitLine(MOON_ORBIT_RADIUS));
moonSystemGroup.add(moon);
scene.add(moonSystemGroup);

// --- Astronomical Calculations ---
function getAstronomicalAngles(date) {
    const startOfYear = new Date(date.getFullYear(), 0, 0);
    const dayOfYear = (date - startOfYear) / (1000 * 60 * 60 * 24);
    const earthRevAngle = (dayOfYear / 365.25) * 2 * Math.PI - (Math.PI / 2);

    const secondsToday = date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds() + date.getMilliseconds() / 1000;
    const earthRotAngle = (secondsToday / 86400) * 2 * Math.PI;

    const refEpoch = new Date(Date.UTC(2024, 0, 11, 11, 57)); 
    const daysSinceEpoch = (date - refEpoch) / (1000 * 60 * 60 * 24);
    const synodicMonth = 29.53059;
    const moonPhaseProgress = ((daysSinceEpoch % synodicMonth) + synodicMonth) % synodicMonth;
    const moonRevAngle = (moonPhaseProgress / synodicMonth) * 2 * Math.PI;

    return { earthRevAngle, earthRotAngle, moonRevAngle, moonPhaseProgress };
}

// --- 2D Moon Phase Renderer ---
const moonCanvas = document.getElementById('moonCanvas');
const mCtx = moonCanvas.getContext('2d');

function updateTelemetry(date, phaseProgress) {
    // 1. Update Date String
    document.getElementById('dateDisplay').textContent = date.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';

    // 2. Determine Moon Phase Name & Illumination
    const phaseRatio = phaseProgress / 29.53059; // 0.0 to 1.0
    let phaseName = "";

    if (phaseRatio < 0.03 || phaseRatio > 0.97) phaseName = "New Moon";
    else if (phaseRatio < 0.22) phaseName = "Waxing Crescent";
    else if (phaseRatio < 0.28) phaseName = "First Quarter";
    else if (phaseRatio < 0.47) phaseName = "Waxing Gibbous";
    else if (phaseRatio < 0.53) phaseName = "Full Moon";
    else if (phaseRatio < 0.72) phaseName = "Waning Gibbous";
    else if (phaseRatio < 0.78) phaseName = "Third Quarter";
    else phaseName = "Waning Crescent";

    const illumPct = Math.round((1 - Math.cos(phaseRatio * 2 * Math.PI)) / 2 * 100);

    document.getElementById('phaseName').textContent = phaseName;
    document.getElementById('illuminationDisplay').textContent = `Illumination: ${illumPct}%`;

    // 3. Draw 2D Moon Phase Visualizer
    mCtx.clearRect(0, 0, 100, 100);
    const r = 40;
    const cx = 50, cy = 50;

    // Draw Dark Base
    mCtx.beginPath();
    mCtx.arc(cx, cy, r, 0, 2 * Math.PI);
    mCtx.fillStyle = "#1c1c24";
    mCtx.fill();

    // Draw Illuminated Portion
    mCtx.beginPath();
    mCtx.fillStyle = "#e6e6fa";

    for (let y = -r; y <= r; y++) {
        const xLimit = Math.sqrt(r * r - y * y);
        const cosAngle = Math.cos(phaseRatio * 2 * Math.PI);
        let xLit;

        if (phaseRatio <= 0.5) {
            // Waxing: lit on right side
            xLit = xLimit * cosAngle;
            mCtx.fillRect(cx + xLit, cy + y, xLimit - xLit, 1);
        } else {
            // Waning: lit on left side
            xLit = -xLimit * cosAngle;
            mCtx.fillRect(cx - xLimit, cy + y, xLimit - xLit, 1);
        }
    }
}

let lastTimestamp = performance.now();

function animate(currentTimestamp) {
    const dtSeconds = (currentTimestamp - lastTimestamp) / 1000;
    lastTimestamp = currentTimestamp;

    simTime = new Date(simTime.getTime() + dtSeconds * timeMultiplier * 1000);
    const { earthRevAngle, earthRotAngle, moonRevAngle, moonPhaseProgress } = getAstronomicalAngles(simTime);

    const earthX = EARTH_ORBIT_RADIUS * Math.cos(earthRevAngle);
    const earthZ = EARTH_ORBIT_RADIUS * Math.sin(earthRevAngle);
    earth.position.set(earthX, 0, earthZ);
    earth.rotation.y = earthRotAngle;

    moonSystemGroup.position.set(earthX, 0, earthZ);
    moon.position.set(
        MOON_ORBIT_RADIUS * Math.cos(moonRevAngle),
        0,
        MOON_ORBIT_RADIUS * Math.sin(moonRevAngle)
    );

    // Update Telemetry Panel
    updateTelemetry(simTime, moonPhaseProgress);

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
