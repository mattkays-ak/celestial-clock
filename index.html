<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celestial Clock</title>
  <style>
    :root {
      --bg-color: #f7f5f0;
      --card-bg: #f0edb6;
      --text-color: #222;
      --accent-color: #3b5998;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }
    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    canvas {
      background: #faf8f5;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    button, select {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 15px;
      background: #faf8f5;
      border: 1px solid #ddd;
      min-width: 200px;
    }
    .time-display {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Celestial Clock</h1>

  <div class="container">
    <div class="main-panel">
      <canvas id="orbitCanvas" width="650" height="550"></canvas>
      
      <div class="controls">
        <button id="btnReverse">◄ Reverse</button>
        <button id="btnPause">⏸ Pause</button>
        <button id="btnPlay">► Play Real-time</button>
        <button id="btnFF">►► Fast Forward</button>
        
        <select id="speedSelect">
          <option value="1">1x Speed</option>
          <option value="86400">1 Day / sec</option>
          <option value="604800">1 Week / sec</option>
          <option value="2592000">1 Month / sec</option>
        </select>

        <button id="btnReset">Reset Live</button>
      </div>
    </div>

    <div class="info-panel">
      <div>
        <div style="font-size: 12px; letter-spacing: 1px;">CURRENT DATE & TIME</div>
        <div class="time-display" id="dateText">--</div>
        <div id="timeText">--</div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <canvas id="moonCanvas" width="100" height="100"></canvas>
        <div>
          <div><strong>Moon phase:</strong> <span id="phaseName">--</span></div>
          <div><strong>Illumination:</strong> <span id="illuminationText">--%</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // System State
    let simDate = new Date();
    let speedMultiplier = 1;
    let isPaused = false;
    let lastTimestamp = null;

    // Constants
    const LUNAR_MONTH = 29.53058770576; // Days per synodic month
    const KNOWN_NEW_MOON = new Date('2026-01-18T18:12:00Z'); // Fixed reference new moon

    // Elements
    const orbitCanvas = document.getElementById('orbitCanvas');
    const orbitCtx = orbitCanvas.getContext('2d');
    const moonCanvas = document.getElementById('moonCanvas');
    const moonCtx = moonCanvas.getContext('2d');

    // FIX 1: Calculate phase purely as continuous normalized float (0.0 to 1.0)
    function getPhaseFraction(date) {
      const msPerDay = 86400000;
      const elapsedDays = (date - KNOWN_NEW_MOON) / msPerDay;
      return ((elapsedDays % LUNAR_MONTH) + LUNAR_MONTH) % LUNAR_MONTH / LUNAR_MONTH;
    }

    // Phase Name Determination
    function getPhaseName(fraction) {
      if (fraction < 0.03 || fraction > 0.97) return "New Moon";
      if (fraction < 0.22) return "Waxing Crescent";
      if (fraction < 0.28) return "First Quarter";
      if (fraction < 0.47) return "Waxing Gibbous";
      if (fraction < 0.53) return "Full Moon";
      if (fraction < 0.72) return "Waning Gibbous";
      if (fraction < 0.78) return "Third Quarter";
      return "Waning Crescent";
    }

    // FIX 2 & 3: Render Moon Phase using direct bounds & isolated canvas context
    function renderMoonWidget(phaseFraction) {
      const cx = moonCanvas.width / 2;
      const cy = moonCanvas.height / 2;
      const radius = 40;

      const illumination = 0.5 * (1 - Math.cos(2 * Math.PI * phaseFraction));
      const isWaxing = phaseFraction < 0.5; // Direct boundary check

      document.getElementById('phaseName').textContent = getPhaseName(phaseFraction);
      document.getElementById('illuminationText').textContent = Math.round(illumination * 100) + '%';

      moonCtx.save();
      moonCtx.clearRect(0, 0, moonCanvas.width, moonCanvas.height);

      // Base Dark Disk
      moonCtx.beginPath();
      moonCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      moonCtx.fillStyle = '#222222';
      moonCtx.fill();

      // Illuminated Portion
      moonCtx.beginPath();
      if (isWaxing) {
        moonCtx.arc(cx, cy, radius, -Math.PI / 2, Math.PI / 2, false);
      } else {
        moonCtx.arc(cx, cy, radius, Math.PI / 2, -Math.PI / 2, false);
      }

      const xRadius = Math.abs(radius * Math.cos(2 * Math.PI * phaseFraction));

      if (phaseFraction < 0.25 || phaseFraction > 0.75) {
        moonCtx.ellipse(cx, cy, xRadius, radius, 0, Math.PI / 2, -Math.PI / 2, isWaxing);
      } else {
        moonCtx.ellipse(cx, cy, xRadius, radius, 0, Math.PI / 2, -Math.PI / 2, !isWaxing);
      }

      moonCtx.fillStyle = '#f4f4f0';
      moonCtx.fill();
      moonCtx.restore();
    }

    function renderOrbitSystem(phaseFraction) {
      const width = orbitCanvas.width;
      const height = orbitCanvas.height;
      const cx = width / 2;
      const cy = height / 2;

      orbitCtx.save();
      orbitCtx.clearRect(0, 0, width, height);

      // Orbit Path
      orbitCtx.beginPath();
      orbitCtx.arc(cx, cy, 180, 0, Math.PI * 2);
      orbitCtx.strokeStyle = '#e0e0e0';
      orbitCtx.setLineDash([4, 4]);
      orbitCtx.stroke();
      orbitCtx.setLineDash([]);

      // Sun
      orbitCtx.beginPath();
      orbitCtx.arc(cx, cy, 25, 0, Math.PI * 2);
      orbitCtx.fillStyle = '#f5a623';
      orbitCtx.fill();

      // Earth Position (Annual)
      const startOfYear = new Date(simDate.getFullYear(), 0, 1);
      const yearFraction = (simDate - startOfYear) / (365.25 * 86400000);
      const earthAngle = yearFraction * Math.PI * 2 - Math.PI / 2;
      
      const earthX = cx + Math.cos(earthAngle) * 180;
      const earthY = cy + Math.sin(earthAngle) * 180;

      // Earth
      orbitCtx.beginPath();
      orbitCtx.arc(earthX, earthY, 12, 0, Math.PI * 2);
      orbitCtx.fillStyle = '#4a90e2';
      orbitCtx.fill();

      // Moon Position (Synodic relative to Earth)
      const moonAngle = phaseFraction * Math.PI * 2;
      const moonDist = 35;
      const moonX = earthX + Math.cos(moonAngle) * moonDist;
      const moonY = earthY + Math.sin(moonAngle) * moonDist;

      // Moon Body
      orbitCtx.beginPath();
      orbitCtx.arc(moonX, moonY, 5, 0, Math.PI * 2);
      orbitCtx.fillStyle = '#888888';
      orbitCtx.fill();

      orbitCtx.restore();
    }

    function updateUIDisplay() {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('dateText').textContent = simDate.toLocaleDateString(undefined, options);
      document.getElementById('timeText').textContent = simDate.toLocaleTimeString();

      const phase = getPhaseFraction(simDate);
      renderMoonWidget(phase);
      renderOrbitSystem(phase);
    }

    function animate(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (!isPaused) {
        simDate = new Date(simDate.getTime() + delta * speedMultiplier * 1000);
      }

      updateUIDisplay();
      requestAnimationFrame(animate);
    }

    // Event Controls
    document.getElementById('btnPause').onclick = () => isPaused = true;
    document.getElementById('btnPlay').onclick = () => { isPaused = false; speedMultiplier = 1; };
    document.getElementById('btnReverse').onclick = () => { isPaused = false; speedMultiplier = -Math.abs(speedMultiplier); };
    document.getElementById('btnFF').onclick = () => { isPaused = false; speedMultiplier = 86400; };
    document.getElementById('speedSelect').onchange = (e) => { speedMultiplier = parseFloat(e.target.value); };
    document.getElementById('btnReset').onclick = () => { simDate = new Date(); isPaused = false; speedMultiplier = 1; };

    // Start loop
    requestAnimationFrame(animate);
  </script>
</body>
</html>
